name: Build compiler

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            artifact: psic-linux-x86_64
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            artifact: psic-linux-arm64
          - name: macOS Apple Silicon
            runner: macos-14
            artifact: psic-macos-arm64
          - name: Windows x86_64
            runner: windows-2022
            artifact: psic-windows-x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install LLVM and build tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18-dev ninja-build
          echo "LLVM_DIR=$(llvm-config-18 --cmakedir)" >> "$GITHUB_ENV"

      - name: Install LLVM and build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@18 ninja
          echo "LLVM_DIR=$(brew --prefix llvm@18)/lib/cmake/llvm" >> "$GITHUB_ENV"

      # The runner's LLVM installer lacks the development libraries and all
      # backends needed by PSIC. Cache the official full SDK instead.
      - name: Restore LLVM SDK (Windows)
        if: runner.os == 'Windows'
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llvm-sdk
          key: llvm-18.1.8-windows-x86_64-sdk-v1

      - name: Download and extract LLVM SDK (Windows)
        if: runner.os == 'Windows' && steps.llvm-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-sdk.tar.xz'
          $sdk = Join-Path $env:RUNNER_TEMP 'llvm-sdk'
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang%2Bllvm-18.1.8-x86_64-pc-windows-msvc.tar.xz"
          Write-Host 'Downloading LLVM 18.1.8 SDK (large archive)...'
          curl.exe -L --fail --retry 2 --connect-timeout 30 --max-time 600 --speed-limit 1024 --speed-time 60 $url -o $archive
          if ($LASTEXITCODE -ne 0) { throw 'LLVM download failed' }
          # Use 7-Zip for both stages instead of Windows tar's xz extraction.
          # Keep the full SDK: LLVM's CMake exports also check tool paths.
          Write-Host 'Decompressing LLVM SDK with 7-Zip...'
          7z x $archive "-o$env:RUNNER_TEMP" -y -bsp1
          if ($LASTEXITCODE -ne 0) { throw 'LLVM decompression failed' }
          Write-Host 'Extracting LLVM SDK...'
          7z x (Join-Path $env:RUNNER_TEMP 'llvm-sdk.tar') "-o$sdk" -y -bsp1
          if ($LASTEXITCODE -ne 0) { throw 'LLVM extraction failed' }
          Remove-Item $archive, (Join-Path $env:RUNNER_TEMP 'llvm-sdk.tar')

      - name: Locate LLVM SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvmRoot = Join-Path $env:RUNNER_TEMP 'llvm-sdk/clang+llvm-18.1.8-x86_64-pc-windows-msvc'
          $llvmConfig = Join-Path $llvmRoot "lib\cmake\llvm\LLVMConfig.cmake"
          if (-not (Test-Path $llvmConfig)) {
            throw "LLVMConfig.cmake was not found at $llvmConfig"
          }
          "LLVM_DIR=$(Split-Path $llvmConfig)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: >
          cmake -S . -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DLLVM_DIR="${LLVM_DIR}"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -S . -B build-ci
          -G "Visual Studio 17 2022" -A x64
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DLLVM_DIR="$env:LLVM_DIR"

      - name: Build
        run: cmake --build build-ci --config RelWithDebInfo --parallel 2

      - name: Test compiler and library
        run: ctest --test-dir build-ci -C RelWithDebInfo --output-on-failure

      - name: Build and test shared library (Linux x86_64)
        if: matrix.name == 'Linux x86_64'
        run: |
          cmake -S . -B build-shared -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_INCLUDEDIR=include/psic-0.1 -DLLVM_DIR="${LLVM_DIR}"
          cmake --build build-shared --parallel 2
          ctest --test-dir build-shared --output-on-failure

      - name: Check library with sanitizers (Linux x86_64)
        if: matrix.name == 'Linux x86_64'
        run: |
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPSIC_SANITIZE=ON -DPSIC_BUILD_CLI=OFF -DLLVM_DIR="${LLVM_DIR}"
          cmake --build build-sanitize --parallel 2
          ctest --test-dir build-sanitize --output-on-failure

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake --install build-ci --prefix package --config RelWithDebInfo
          tar -C package -czf "${{ matrix.artifact }}.tar.gz" .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --install build-ci --prefix package --config RelWithDebInfo
          if ($LASTEXITCODE -ne 0) { throw 'Installation failed' }
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: error
