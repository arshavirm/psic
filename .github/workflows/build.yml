name: Build compiler

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            artifact: psic-linux-x86_64
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            artifact: psic-linux-arm64
          - name: macOS Apple Silicon
            runner: macos-14
            artifact: psic-macos-arm64
          - name: Windows x86_64
            runner: windows-2022
            artifact: psic-windows-x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install LLVM and build tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18-dev ninja-build
          echo "LLVM_DIR=$(llvm-config-18 --cmakedir)" >> "$GITHUB_ENV"

      - name: Install LLVM and build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@18 ninja
          echo "LLVM_DIR=$(brew --prefix llvm@18)/lib/cmake/llvm" >> "$GITHUB_ENV"

      - name: Install LLVM and build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm --version=18.1.8 --allow-downgrade --yes --no-progress
          choco install ninja --yes --no-progress
          "LLVM_DIR=$env:ProgramFiles\LLVM\lib\cmake\llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: >
          cmake -S . -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DLLVM_DIR="${LLVM_DIR}"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -S . -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DLLVM_DIR="$env:LLVM_DIR"

      - name: Build
        run: cmake --build build-ci --parallel

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p package
          cp build-ci/psic package/
          tar -C package -czf "${{ matrix.artifact }}.tar.gz" psic

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build-ci/psic.exe package/
          Compress-Archive -Path package/psic.exe -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: error
